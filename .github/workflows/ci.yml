name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt, vet and tests
        run: make check

      # GoReleaser builds for these systems; breaking one would only show on
      # release day.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "→ $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/dotdl
          done

      - name: Install scripts
        run: shellcheck scripts/*.sh scripts/dotdl-docker

  docker:
    # Only on main: the image takes a while to build and PRs rarely touch it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image (dotdl:latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          load: true
          tags: dotdl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # doctor fails when yt-dlp, ffmpeg, ffprobe or deno do not run.
      - name: Smoke test
        run: docker run --rm dotdl:latest doctor
