# GoReleaser: dotdl binaries for every system, published as a GitHub
# release when a vX.Y.Z tag is pushed (see .github/workflows/release.yml).
# Locally, without publishing: make release-snapshot.
version: 2

project_name: dotdl

before:
  hooks:
    - go mod verify

builds:
  - id: dotdl
    main: ./cmd/dotdl
    binary: dotdl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: dotdl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # scripts/install.sh relies on this name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # install-deps.sh ships in the archive so install.sh can install yt-dlp,
    # deno and ffmpeg without the repository.
    files:
      - LICENSE
      - README.md
      - .env.example
      - scripts/install-deps.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  prerelease: auto
